<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KathaVani - Multi-Language Digital Book Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf4f0',
                            100: '#fbe8e1',
                            500: '#e65100',
                            600: '#d84315',
                            700: '#bf360c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col antialiased font-sans select-none">

    <div id="app" class="flex flex-col h-full w-full overflow-hidden">
        <!-- Main dynamic content container -->
    </div>

    <!-- Toast notification container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Script -->
    <script>
        const LANGUAGES = [
            { code: 'en', name: 'English' },
            { code: 'hi', name: 'Hindi (हिन्दी)' },
            { code: 'te', name: 'Telugu (తెలుగు)' },
            { code: 'ta', name: 'Tamil (தமிழ்)' },
            { code: 'bn', name: 'Bengali (বাংলা)' },
            { code: 'mr', name: 'Marathi (मराठी)' },
            { code: 'gu', name: 'Gujarati (ગુજરાતી)' },
            { code: 'kn', name: 'Kannada (ಕನ್ನಡ)' },
            { code: 'ml', name: 'Malayalam (മലയാളം)' },
            { code: 'pa', name: 'Punjabi (ਪੰਜਾਬੀ)' },
            { code: 'ur', name: 'Urdu (اردو)' }
        ];

        let books = [
            {
                id: 'book-1',
                title: 'The Wings of Fire (Agni Pankh)',
                author: 'Dr. A.P.J. Abdul Kalam',
                category: 'Autobiography / Inspiration',
                cover: 'https://placehold.co/400x600/e65100/ffffff?text=Wings+of+Fire',
                description: 'An inspiring autobiography of India’s visionary scientist and President.',
                fullText: {
                    en: "Ignite your mind and soar high. Dreams are not what you see in sleep, dreams are things which do not let you sleep.",
                    hi: "अपने मन को प्रज्वलित करें और ऊंची उड़ान भरें। सपने वे नहीं हैं जो हम सोते समय देखते हैं...",
                    te: "మీ మనస్సును వెలిగించండి మరియు ఉన్నతంగా ఎగరండి. కలలు అనేవి నిద్రలో కనేవి కావు, నిద్రపోనిచ్చేవి కావు.",
                    ta: "உங்கள் மனதை எரியச் செய்து உயரமாக பறக்கவும்."
                },
                audioDuration: 345
            },
            {
                id: 'book-2',
                title: 'Gitanjali (Song Offerings)',
                author: 'Rabindranath Tagore',
                category: 'Poetry / Philosophy',
                cover: 'https://placehold.co/400x600/1e293b/ffffff?text=Gitanjali',
                description: 'A collection of profound devotional poems that earned Rabindranath Tagore the Nobel Prize.',
                fullText: {
                    en: "Where the mind is without fear and the head is held high; Where knowledge is free.",
                    hi: "जहाँ मन भयमुक्त हो और मस्तक ऊँचा हो।",
                    te: "ఎక్కడ మనస్సు నిర్భయంగా ఉంటుందో మరియు తల ఎత్తుగా ఉంటుందో."
                },
                audioDuration: 280
            }
        ];

        let requestedBooks = [
            { id: 'req-1', title: 'Bhagavad Gita Simplified', userEmail: 'Jayashankar9381@gmail.com', date: '2026-06-10' }
        ];

        // Owner / User Session State
        let currentUser = {
            isLoggedIn: true,
            name: 'Jayashankar (Owner)',
            email: 'Jayashankar9381@gmail.com',
            phone: '9381198260',
            role: 'owner', // 'owner' or 'customer'
            avatar: 'https://placehold.co/100x100/e65100/ffffff?text=JS',
            autoPayActive: true,
            subscriptionValidUntil: '2027-06-15',
            paymentLink: 'https://rzp.io/rzp/vyiezJv'
        };

        let appSettings = {
            interfaceLang: 'te',
            notificationsEnabled: true
        };

        let activeTab = 'home';
        let currentReadingBook = null;
        let searchKeyword = '';

        let audioState = {
            isPlaying: false,
            currentTime: 0,
            duration: 300,
            playbackRate: 1.0,
            selectedLang: 'te'
        };

        function render() {
            const appEl = document.getElementById('app');
            appEl.innerHTML = '';

            const header = renderHeader();
            appEl.appendChild(header);

            const mainContent = document.createElement('main');
            mainContent.className = 'flex-1 overflow-y-auto relative pb-24';
            
            if (activeTab === 'home') {
                mainContent.innerHTML = renderHomePage();
            } else if (activeTab === 'search') {
                mainContent.innerHTML = renderSearchPage();
            } else if (activeTab === 'settings') {
                mainContent.innerHTML = renderSettingsPage();
            } else if (activeTab === 'admin') {
                if (currentUser.role === 'owner') {
                    mainContent.innerHTML = renderAdminDashboard();
                } else {
                    activeTab = 'home';
                    showToast('యాక్సెస్ నిరాకరించబడింది.', 'error');
                    render();
                    return;
                }
            } else if (activeTab === 'reader') {
                mainContent.innerHTML = renderReaderView();
            }

            appEl.appendChild(mainContent);

            if (activeTab !== 'reader' && activeTab !== 'admin') {
                const bottomNav = renderBottomNav();
                appEl.appendChild(bottomNav);
            }

            lucide.createIcons();
        }

        function renderHeader() {
            const header = document.createElement('header');
            header.className = 'bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-35 sticky top-0';
            
            header.innerHTML = `
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                    <div class="bg-gradient-to-tr from-brand-600 to-amber-500 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-slate-900 tracking-tight flex items-center gap-1.5">
                            కథావాణి <span class="text-xs bg-brand-50 text-brand-600 font-semibold px-2 py-0.5 rounded-full border border-brand-100">బహుభాషా</span>
                        </h1>
                        <p class="text-xs text-slate-500">ডিజిటల్ బుక్స్ & ఆడియో ప్లాట్‌ఫారమ్</p>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    ${currentUser.role === 'owner' ? `
                        <button onclick="switchTab('admin')" class="px-3 py-1.5 bg-slate-900 text-white text-xs font-semibold rounded-lg shadow hover:bg-slate-800 transition flex items-center gap-1.5">
                            <i data-lucide="shield-check" class="w-4 h-4"></i> ఓనర్ అడ్మిన్
                        </button>
                    ` : `
                        <button onclick="switchToOwnerLogin()" class="px-3 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 text-xs font-semibold rounded-lg border border-amber-200 transition flex items-center gap-1">
                            <i data-lucide="key" class="w-3.5 h-3.5"></i> ఓనర్ లాగిన్
                        </button>
                    `}

                    <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
                        <img src="${currentUser.avatar}" alt="${currentUser.name}" class="w-8 h-8 rounded-full border border-slate-300 object-cover">
                        <div class="hidden sm:block text-left">
                            <p class="text-xs font-semibold text-slate-800 leading-none">${currentUser.name}</p>
                            <p class="text-[10px] text-slate-500">${currentUser.email}</p>
                        </div>
                    </div>
                </div>
            `;
            return header;
        }

        function renderHomePage() {
            return `
                <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
                    <!-- Auto-Pay Subscription Banner -->
                    <div class="bg-gradient-to-r from-brand-700 via-brand-600 to-amber-600 rounded-3xl p-6 md:p-8 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between">
                        <div class="space-y-3 z-10 max-w-xl text-center md:text-left">
                            <span class="bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm">ఆటో-పే సబ్‌స్క్రిప్షన్</span>
                            <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">అన్ని పుస్తకాలు & ఆడియోలను అన్‌లాక్ చేయండి</h2>
                            <p class="text-white/90 text-sm">ప్రతి పుస్తకానికి ఒకే ప్రైస్ మరియు ఆటో-పే ద్వారా నిరంతరంగా వినండి.</p>
                            <div class="flex flex-wrap gap-3 pt-2 justify-center md:justify-start">
                                <a href="${currentUser.paymentLink}" target="_blank" class="bg-white text-brand-700 hover:bg-brand-50 px-5 py-2.5 rounded-xl font-bold text-xs shadow-md transition flex items-center gap-2">
                                    <i data-lucide="credit-card" class="w-4 h-4"></i> ఆటో-పే చెల్లింపు లింక్ (Pay Now)
                                </a>
                            </div>
                        </div>
                        <div class="mt-6 md:mt-0 z-10 bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 text-center text-xs space-y-1">
                            <p class="text-white/80 font-medium">సబ్‌స్క్రిప్షన్ గడువు</p>
                            <p class="font-bold text-white">${currentUser.subscriptionValidUntil} వరకు</p>
                            <button onclick="toggleAutoPay()" class="mt-2 px-3 py-1 bg-amber-400 text-slate-900 font-bold rounded-lg text-[10px]">
                                ఆటో-పే: ${currentUser.autoPayActive ? 'యాక్టివ్ (మార్చు)' : 'నిలిపివేయబడింది'}
                            </button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                                <i data-lucide="library" class="w-5 h-5 text-brand-600"></i> అందుబాటులో ఉన్న డిజిటల్ పుస్తకాలు (${books.length})
                            </h3>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${books.map(book => renderBookCard(book)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBookCard(book) {
            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col overflow-hidden relative group">
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-2 left-2 bg-slate-900/70 backdrop-blur-md text-white text-[10px] font-semibold px-2.5 py-1 rounded-lg">
                            ${book.category}
                        </span>
                    </div>

                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h4 class="font-bold text-slate-900 text-base leading-snug line-clamp-1">${book.title}</h4>
                            <p class="text-xs text-slate-500 font-medium mt-0.5">రచయిత: ${book.author}</p>
                            <p class="text-xs text-slate-600 mt-2 line-clamp-2">${book.description}</p>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                            <button onclick="openReader('${book.id}')" class="flex-1 py-2 px-3 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl transition shadow-sm flex items-center justify-center gap-1.5">
                                <i data-lucide="headphones" class="w-3.5 h-3.5"></i> చదవండి / వినండి
                            </button>
                            <button onclick="shareBook('${book.title}')" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition" title="షేర్ చేయండి">
                                <i data-lucide="share-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSearchPage() {
            const foundBooks = searchKeyword.trim() === '' ? books : books.filter(b => 
                b.title.toLowerCase().includes(searchKeyword.toLowerCase()) || 
                b.author.toLowerCase().includes(searchKeyword.toLowerCase())
            );

            return `
                <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-900">పుస్తకాల కోసం వెతకండి</h2>
                        <p class="text-xs md:text-sm text-slate-500">ఓనర్ అప్‌లోడ్ చేసిన పుస్తకాలు క్రింద పేర్ల రూపంలో కనిపిస్తాయి.</p>
                    </div>

                    <div class="relative max-w-xl mx-auto">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="search-input" value="${searchKeyword}" oninput="handleSearchInput(event)" placeholder="పుస్తకం లేదా రచయిత పేరు టైప్ చేయండి..." class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-300 rounded-2xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                    </div>

                    <div class="space-y-4">
                        ${foundBooks.length > 0 ? `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${foundBooks.map(book => `
                                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4 hover:border-brand-300 transition cursor-pointer" onclick="openReader('${book.id}')">
                                        <img src="${book.cover}" class="w-16 h-20 object-cover rounded-xl shadow">
                                        <div class="flex-1 min-w-0">
                                            <h4 class="font-bold text-slate-900 text-sm truncate">${book.title}</h4>
                                            <p class="text-xs text-slate-500">రచయిత: ${book.author}</p>
                                            <span class="inline-block mt-1 text-[10px] bg-brand-50 text-brand-700 font-semibold px-2 py-0.5 rounded">అందుబాటులో ఉంది</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4 shadow-sm max-w-lg mx-auto">
                                <h3 class="text-lg font-bold text-slate-900">ఈ పేరుతో పుస్తకం దొరకలేదు</h3>
                                <p class="text-xs text-slate-500">మీకు కావలసిన పుస్తకాన్ని ఓనర్‌కి రిక్వెస్ట్ పంపవచ్చు.</p>
                                <button onclick="requestBook('${searchKeyword}')" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 shadow transition">
                                    పుస్తకం కోసం రిక్వెస్ట్ చేయండి
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderSettingsPage() {
            return `
                <div class="max-w-2xl mx-auto p-4 md:p-6 space-y-6">
                    <h2 class="text-2xl font-bold text-slate-900">సెట్టింగ్‌లు (Settings)</h2>

                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm divide-y divide-slate-100 overflow-hidden">
                        <div class="p-5 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">యూజర్ లాగిన్ వివరాలు</h4>
                                <p class="text-xs text-slate-500">${currentUser.email} | ఫోన్: ${currentUser.phone}</p>
                            </div>
                            <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold rounded-xl transition">
                                లాగౌట్ (Logout)
                            </button>
                        </div>

                        <div class="p-5 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">వెబ్‌సైట్ డిఫాల్ట్ భాష (Language)</h4>
                                <p class="text-xs text-slate-500">ప్లాట్‌ఫారమ్ ఇంటర్‌ఫేస్ భాషను ఎంచుకోండి</p>
                            </div>
                            <select onchange="changeInterfaceLang(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs font-semibold rounded-xl px-3 py-2">
                                ${LANGUAGES.map(l => `<option value="${l.code}" ${appSettings.interfaceLang === l.code ? 'selected' : ''}>${l.name}</option>`).join('')}
                            </select>
                        </div>

                        <div class="p-5 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">పుస్తక నోటిఫికేషన్‌లు</h4>
                                <p class="text-xs text-slate-500">ఓనర్ కొత్త పుస్తకం అప్‌లోడ్ చేసినప్పుడు నోటిఫికేషన్ పొందండి</p>
                            </div>
                            <button onclick="toggleNotifications()" class="px-4 py-2 ${appSettings.notificationsEnabled ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'} text-xs font-bold rounded-xl transition">
                                ${appSettings.notificationsEnabled ? 'ఆన్ చేయబడింది (On)' : 'ఆఫ్ చేయబడింది (Off)'}
                            </button>
                        </div>

                        <div class="p-5 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">వెబ్‌సైట్ షేర్ చేయండి</h4>
                                <p class="text-xs text-slate-500">ఈ ప్లాట్‌ఫారమ్‌ను మీ స్నేహితులతో పంచుకోండి</p>
                            </div>
                            <button onclick="shareWebsite()" class="px-4 py-2 bg-brand-50 text-brand-700 hover:bg-brand-100 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
                                <i data-lucide="share-2" class="w-4 h-4"></i> షేర్ చేయండి
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReaderView() {
            if (!currentReadingBook) return '';
            const textContent = currentReadingBook.fullText[audioState.selectedLang] || currentReadingBook.fullText['en'];

            return `
                <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
                    <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <button onclick="switchTab('home')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> వెనక్కి వెళ్ళండి
                        </button>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-900 text-sm md:text-base">${currentReadingBook.title}</h3>
                        </div>
                        <select onchange="changeReaderLanguage(this.value)" class="bg-brand-50 border border-brand-200 text-brand-700 text-xs font-semibold rounded-xl px-3 py-2">
                            ${LANGUAGES.map(l => `<option value="${l.code}" ${audioState.selectedLang === l.code ? 'selected' : ''}>${l.name}</option>`).join('')}
                        </select>
                    </div>

                    <!-- Audio Player Controls (10s Backward / Forward & Human Voice Simulation) -->
                    <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-xl space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs text-amber-400 font-semibold">AI హ్యూమన్ వాయిస్ ఆడియో</p>
                                <h4 class="text-sm font-bold mt-0.5">${currentReadingBook.title} (${audioState.selectedLang.toUpperCase()})</h4>
                            </div>
                            <span class="px-3 py-1 bg-white/10 text-xs rounded-full">నిజమైన మనిషి గొంతు వలె</span>
                        </div>

                        <div class="flex items-center justify-center space-x-6 py-2">
                            <button onclick="skipAudio(-10)" class="p-3 bg-white/10 hover:bg-white/20 rounded-full transition flex items-center gap-1 text-xs" title="10 సెకన్లు వెనక్కి">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i> -10s
                            </button>
                            <button onclick="togglePlayAudio()" class="p-4 bg-brand-600 hover:bg-brand-700 rounded-full transition shadow-lg">
                                <i data-lucide="${audioState.isPlaying ? 'pause' : 'play'}" class="w-6 h-6"></i>
                            </button>
                            <button onclick="skipAudio(10)" class="p-3 bg-white/10 hover:bg-white/20 rounded-full transition flex items-center gap-1 text-xs" title="10 సెకన్లు ముందుకు">
                                +10s <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Book Text Content -->
                    <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <div class="prose max-w-none text-slate-800 text-base md:text-lg leading-relaxed whitespace-pre-line">
                            ${textContent}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminDashboard() {
            return `
                <div class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
                    <div class="bg-slate-900 text-white p-6 md:p-8 rounded-3xl shadow-xl space-y-2">
                        <div class="inline-flex items-center gap-2 bg-brand-600/30 border border-brand-500/40 px-3 py-1 rounded-full text-xs font-semibold text-brand-300">
                            <i data-lucide="shield-check" class="w-4 h-4"></i> ఓనర్ అడ్మిన్ పోర్టల్
                        </div>
                        <h2 class="text-2xl font-bold">స్వాగతం, ${currentUser.name}</h2>
                        <p class="text-xs text-slate-400">జిమెయిల్: ${currentUser.email} | ఫోన్: ${currentUser.phone}</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Book Upload Form -->
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-5 h-5 text-brand-600"></i> కొత్త పుస్తకాన్ని అప్‌లోడ్ చేయండి
                            </h3>

                            <form onsubmit="handleBookUpload(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">పుస్తకం పేరు (Book Title)</label>
                                    <input type="text" id="upload-title" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">రచయిత (Author)</label>
                                    <input type="text" id="upload-author" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">వివరణ (Description)</label>
                                    <textarea id="upload-desc" rows="2" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">పూర్తి పాఠం / టెక్స్ట్ (Full Text for Auto Audio & Translation)</label>
                                    <textarea id="upload-text" rows="3" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs" placeholder="ఇక్కడ టెక్స్ట్ ఇవ్వండి. ఇది ఆటోమేటిక్‌గా అన్ని భాషల్లోకి మరియు మనిషి వాయిస్‌లా మారుతుంది..."></textarea>
                                </div>
                                <button type="submit" class="w-full py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">
                                    పుస్తకాన్ని ప్రచురించు & ఆడియో సృష్టించు
                                </button>
                            </form>
                        </div>

                        <!-- User Requests Management -->
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                                <i data-lucide="bell" class="w-5 h-5 text-amber-600"></i> యూజర్ పుస్తక రిక్వెస్ట్‌లు
                            </h3>
                            <div class="space-y-2">
                                ${requestedBooks.length > 0 ? requestedBooks.map(req => `
                                    <div class="p-3 bg-slate-50 rounded-xl border flex items-center justify-between">
                                        <div>
                                            <h4 class="font-bold text-slate-900 text-xs">${req.title}</h4>
                                            <p class="text-[10px] text-slate-500">యూజర్: ${req.userEmail}</p>
                                        </div>
                                        <button onclick="fulfillRequest('${req.id}')" class="px-2.5 py-1.5 bg-emerald-600 text-white rounded-lg text-[10px] font-bold">
                                            అప్‌లోడ్ చేయండి
                                        </button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-500">కొత్త రిక్వెస్ట్‌లు లేవు.</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBottomNav() {
            const nav = document.createElement('nav');
            nav.className = 'fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2.5 flex items-center justify-around z-30 shadow-lg md:max-w-md md:mx-auto md:mb-4 md:rounded-2xl md:border';
            
            const tabs = [
                { id: 'home', label: 'హోమ్ పేజీ', icon: 'home' },
                { id: 'search', label: 'సెర్చింగ్', icon: 'search' },
                { id: 'settings', label: 'సెట్టింగ్', icon: 'settings' }
            ];

            nav.innerHTML = tabs.map(t => `
                <button onclick="switchTab('${t.id}')" class="flex flex-col items-center space-y-1 transition ${activeTab === t.id ? 'text-brand-600 font-bold' : 'text-slate-400 font-medium'}">
                    <i data-lucide="${t.icon}" class="w-5 h-5"></i>
                    <span class="text-[10px]">${t.label}</span>
                </button>
            `).join('');

            return nav;
        }

        function switchTab(tab) {
            activeTab = tab;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        function openReader(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;
            currentReadingBook = book;
            activeTab = 'reader';
            render();
        }

        function handleSearchInput(e) {
            searchKeyword = e.target.value;
            render();
        }

        function requestBook(title) {
            if (!title.trim()) return;
            requestedBooks.push({
                id: 'req-' + Date.now(),
                title: title,
                userEmail: currentUser.email,
                date: new Date().toISOString().split('T')[0]
            });
            showToast('పుస్తకం కోసం రిక్వెస్ట్ విజయవంతంగా పంపబడింది!', 'success');
            render();
        }

        function fulfillRequest(reqId) {
            requestedBooks = requestedBooks.filter(r => r.id !== reqId);
            showToast('రిక్వెస్ట్ క్లియర్ చేయబడింది!', 'success');
            render();
        }

        function changeReaderLanguage(langCode) {
            audioState.selectedLang = langCode;
            showToast(`భాష మార్చబడింది: ${langCode.toUpperCase()}`, 'success');
            render();
        }

        function changeInterfaceLang(langCode) {
            appSettings.interfaceLang = langCode;
            showToast('వెబ్‌సైట్ భాష మార్చబడింది', 'success');
        }

        function toggleNotifications() {
            appSettings.notificationsEnabled = !appSettings.notificationsEnabled;
            showToast(appSettings.notificationsEnabled ? 'నోటిఫికేషన్‌లు ఆన్ చేయబడ్డాయి' : 'నోటిఫికేషన్‌లు ఆఫ్ చేయబడ్డాయి', 'success');
            render();
        }

        function toggleAutoPay() {
            currentUser.autoPayActive = !currentUser.autoPayActive;
            showToast(currentUser.autoPayActive ? 'ఆటో-పే యాక్టివేట్ చేయబడింది' : 'ఆటో-పే రద్దు చేయబడింది', 'success');
            render();
        }

        function skipAudio(seconds) {
            showToast(`ఆడియో ${seconds > 0 ? '+' : ''}${seconds} సెకన్లు సర్దుబాటు చేయబడింది`, 'info');
        }

        function togglePlayAudio() {
            audioState.isPlaying = !audioState.isPlaying;
            render();
        }

        function switchToOwnerLogin() {
            currentUser.role = 'owner';
            currentUser.name = 'Jayashankar (Owner)';
            currentUser.email = 'Jayashankar9381@gmail.com';
            currentUser.phone = '9381198260';
            showToast('ఓనర్ అడ్మిన్ లాగిన్ విజయవంతం!', 'success');
            switchTab('admin');
        }

        function handleLogout() {
            currentUser.role = 'customer';
            currentUser.isLoggedIn = false;
            showToast('లాగౌట్ అయ్యారు', 'info');
            render();
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({ title: 'KathaVani', url: window.location.href });
            } else {
                showToast('వెబ్‌సైట్ లింక్ కాపీ చేయబడింది!', 'success');
            }
        }

        function shareBook(title) {
            showToast(`"${title}" పుస్తకం షేర్ చేయబడింది!`, 'success');
        }

        function handleBookUpload(e) {
            e.preventDefault();
            const title = document.getElementById('upload-title').value;
            const author = document.getElementById('upload-author').value;
            const desc = document.getElementById('upload-desc').value;
            const text = document.getElementById('upload-text').value;

            const newBook = {
                id: 'book-' + (books.length + 1),
                title,
                author,
                category: 'New Release',
                cover: 'https://placehold.co/400x600/e65100/ffffff?text=' + encodeURIComponent(title),
                description: desc,
                fullText: {
                    en: text,
                    hi: "हिन्दी अनुवाद: " + text,
                    te: "తెలుగు అనువాదం (మనిషి గొంతు వలె): " + text,
                    ta: "தமிழ் மொழிபெயர்ப்பு: " + text
                },
                audioDuration: 300
            };

            books.unshift(newBook);
            showToast(`పుస్తకం "${title}" విజయవంతంగా ప్రచురించబడింది!`, 'success');
            switchTab('home');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
